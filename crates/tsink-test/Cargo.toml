[package]
name = "tsink-test"
version = "0.10.2"
edition = "2021"
rust-version = "1.89"
authors = ["cantrepro"]
description = "In-process test fixtures for the tsink embedded metrics database"
repository = "https://github.com/cantrepro/tsink"
homepage = "https://github.com/cantrepro/tsink"
documentation = "https://docs.rs/tsink-test"
license = "MIT"
readme = "README.md"
keywords = ["time-series", "database", "prometheus", "testing", "metrics"]
categories = ["development-tools::testing", "database"]

[features]
default = []
prometheus = ["dep:prost", "dep:snap", "dep:tsink-protocol"]

[dependencies]
prost = { version = "0.14", optional = true }
snap = { version = "1.1", optional = true }
tempfile = "3.26"
tsink = { version = "0.10.2", path = "../.." }
tsink-protocol = { version = "0.10.2", path = "../tsink-protocol", optional = true }
