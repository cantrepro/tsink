[package]
name = "tsink-server"
version = "0.10.2"
edition = "2021"
rust-version = "1.89"
authors = ["cantrepro"]
description = "Optional standalone protocol server for the tsink embedded metrics engine"
repository = "https://github.com/cantrepro/tsink"
homepage = "https://github.com/cantrepro/tsink"
documentation = "https://github.com/cantrepro/tsink/blob/master/docs/server-deployment.md"
license = "MIT"
readme = "../../README.md"
keywords = ["time-series", "database", "prometheus", "metrics", "server"]
categories = ["database", "command-line-utilities", "network-programming"]

[dependencies]
tsink = { version = "0.10.2", path = "../.." }
tsink-protocol = { version = "0.10.2", path = "../tsink-protocol" }
prost = "0.14"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
clap = { version = "4.5.51", features = ["derive"] }
chrono = "0.4"
snap = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal", "sync", "macros", "time"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
x509-parser = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
socket2 = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
base64 = "0.22"
ring = "0.17"

[dev-dependencies]
tempfile = "3.26"
