[package]
name = "tsink-uniffi"
version = "0.10.2"
edition = "2021"
rust-version = "1.89"
authors = ["cantrepro"]
description = "Python bindings for the tsink embedded Prometheus-native metrics database"
repository = "https://github.com/cantrepro/tsink"
homepage = "https://github.com/cantrepro/tsink"
documentation = "https://github.com/cantrepro/tsink/blob/master/docs/python-bindings.md"
license = "MIT"
readme = "../../README.md"
keywords = ["time-series", "database", "prometheus", "metrics", "python"]
categories = ["database", "api-bindings"]

[lib]
crate-type = ["cdylib", "lib"]
name = "tsink"
doc = false

[dependencies]
tsink_core = { package = "tsink", version = "0.10.2", path = "../.." }
uniffi = { version = "0.31", features = ["cli"] }
parking_lot = "0.12"
thiserror = "2.0"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3.26"
