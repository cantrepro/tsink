[package]
name = "tsink"
version = "0.10.2"
edition = "2021"
rust-version = "1.89"
authors = ["cantrepro"]
description = "An embeddable Prometheus-native metrics database with durable local retention and PromQL"
repository = "https://github.com/cantrepro/tsink"
homepage = "https://github.com/cantrepro/tsink"
documentation = "https://docs.rs/tsink"
license = "MIT"
keywords = ["time-series", "database", "embedded", "tsdb", "metrics"]
categories = ["database", "embedded", "data-structures"]
readme = "README.md"
exclude = [".github/**", "GOAL.md", "docs/goal-progress.md", "scripts/**"]

[workspace]
members = [".", "crates/tsink-server", "crates/tsink-uniffi"]
default-members = [".", "crates/tsink-server", "crates/tsink-uniffi"]
resolver = "2"

[dependencies]
thiserror = "2.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
num_cpus = "1.17"
crc32fast = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
memmap2 = "0.9"
tracing = "0.1"
regex = "1.12"
regex-syntax = "0.8"
chrono = "0.4"
async-channel = "2.5"
roaring = "0.11"
zstd = "0.13"
same-file = "1.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
tempfile = "3.26"
proptest = "1.10"
env_logger = "0.11"
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "workload"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
